[project]
name = "broom"
version = "0.1.0"
description = "Local Gmail cleaner: classify promotional vs important mail with Mirage + laya-mlx."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mirage-ai>=0.0.6",
    "laya-mlx>=0.3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "pydantic-settings>=2.0",
]

[project.scripts]
broom = "broom.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["broom"]

[tool.uv]
package = true
